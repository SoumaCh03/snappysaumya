<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>SnappySaumya | Photography by Saumyadeep Chakraborty</title>

    <meta
      name="description"
      content="SnappySaumya is the photography portfolio of Saumyadeep Chakraborty featuring travel, street, landscape, and creative visual storytelling across India."
    />

    <meta
      name="keywords"
      content="SnappySaumya, Saumyadeep Chakraborty, photography portfolio, Indian photographer, travel photography India, street photography, landscape photography, Nikon D7500 photography"
    />

    <meta name="author" content="Saumyadeep Chakraborty" />
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#030712" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:title" content="SnappySaumya Photography" />
    <meta
      property="og:description"
      content="Visual stories through my lens — travel, street, and beyond."
    />
    <meta property="og:image" content="/preview.jpg" />
    <meta property="og:url" content="https://snappysaumya.vercel.app" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SnappySaumya" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SnappySaumya Photography" />
    <meta
      name="twitter:description"
      content="Travel, street, and cinematic photography by Saumyadeep Chakraborty."
    />
    <meta name="twitter:image" content="/preview.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://snappysaumya.vercel.app/" />

    <!-- Preload (optional performance boost) -->
    <link rel="preload" as="image" href="/preview.jpg" />

    <!-- Structured Data (VERY IMPORTANT) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Saumyadeep Chakraborty",
        "url": "https://snappysaumya.vercel.app",
        "image": "https://snappysaumya.vercel.app/preview.jpg",
        "jobTitle": "Photographer",
        "sameAs": [
          "https://techysaumyadeep.vercel.app"
        ],
        "knowsAbout": [
          "Photography",
          "Travel Photography",
          "Street Photography",
          "Visual Storytelling"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
